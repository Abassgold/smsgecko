services:
  mongo:
    image: mongo:7
    container_name: smsgecko-mongo
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - ./mongo-data:/data/db
    healthcheck:
      test: >
        echo "try { rs.status().ok } catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })
        }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 2s
      retries: 30
